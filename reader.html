<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="readingTitle">Reading - EPUB Reader</title>
  <link rel="stylesheet" href="css/common.css?v=12">
  <link rel="stylesheet" href="css/reader.css?v=12">
</head>
<body class="reader-body">
  <header class="reader-header" id="reader-header">
    <button class="header-btn" id="btn-back" data-i18n-title="previous">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/>
      </svg>
    </button>
    <span class="book-title-header" id="header-title"></span>
    <div class="header-controls">
      <button class="header-btn" id="btn-toc" data-i18n-title="tableOfContents">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/>
        </svg>
      </button>
      <button class="header-btn" id="btn-bookmarks" data-i18n-title="bookmarks">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"/>
        </svg>
      </button>
      <button class="header-btn" id="btn-settings" data-i18n-title="settings">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"/>
        </svg>
      </button>
      <button class="header-btn btn-lang" id="btn-lang">EN</button>
      <button class="header-btn" id="btn-shortcuts" data-i18n-title="keyboardShortcuts" title="键盘快捷键">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="reader-container">
    <div id="epub-viewer"></div>
    <button class="nav-prev" id="btn-prev" data-i18n-title="previous"></button>
    <button class="nav-next" id="btn-next" data-i18n-title="next"></button>
  </div>

  <aside class="panel toc-sidebar" id="toc-sidebar">
    <div class="panel-header">
      <h2 data-i18n="tableOfContents">Table of Contents</h2>
      <button class="panel-close" data-panel="toc-sidebar">&times;</button>
    </div>
    <nav id="toc-list"></nav>
  </aside>

  <aside class="panel bookmarks-panel" id="bookmarks-panel">
    <div class="panel-header">
      <h2 data-i18n="bookmarks">Bookmarks</h2>
      <button class="panel-close" data-panel="bookmarks-panel">&times;</button>
    </div>
    <ul id="bookmarks-list"></ul>
    <button class="btn btn-primary btn-add-bookmark" id="btn-add-bookmark" data-i18n="addBookmark">+ Add Bookmark</button>
  </aside>

  <aside class="panel settings-panel" id="settings-panel">
    <div class="panel-header">
      <h2 data-i18n="settings">Settings</h2>
      <button class="panel-close" data-panel="settings-panel">&times;</button>
    </div>
    <div class="setting-group">
      <label data-i18n="fontSize">Font Size</label>
      <div class="setting-controls">
        <button class="btn btn-sm" id="btn-font-decrease">A-</button>
        <span id="font-size-display">100%</span>
        <button class="btn btn-sm" id="btn-font-increase">A+</button>
      </div>
    </div>
    <div class="setting-group">
      <label data-i18n="font">Font</label>
      <select id="font-family-select">
        <option value="Georgia">Georgia</option>
        <option value="Palatino">Palatino</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="sans-serif">Sans-serif</option>
      </select>
    </div>
    <div class="setting-group">
      <label data-i18n="theme">Theme</label>
      <div class="theme-buttons">
        <button class="theme-btn" data-theme="light" data-i18n="light">Light</button>
        <button class="theme-btn" data-theme="sepia" data-i18n="sepia">Sepia</button>
        <button class="theme-btn" data-theme="dark" data-i18n="dark">Dark</button>
      </div>
    </div>
    <div class="setting-group">
      <label data-i18n="clickZone">Click Zone</label>
      <div class="setting-controls">
        <input type="range" id="click-zone-slider" min="3" max="25" value="8" step="1">
        <span id="click-zone-display">8%</span>
      </div>
    </div>
  </aside>

  <div class="highlight-popup" id="highlight-popup" hidden>
    <button class="highlight-color" data-color="#ffeb3b" style="background:#ffeb3b" data-i18n-title="yellow"></button>
    <button class="highlight-color" data-color="#a5d6a7" style="background:#a5d6a7" data-i18n-title="green"></button>
    <button class="highlight-color" data-color="#90caf9" style="background:#90caf9" data-i18n-title="blue"></button>
    <button class="highlight-color" data-color="#ef9a9a" style="background:#ef9a9a" data-i18n-title="red"></button>
    <button class="highlight-remove" data-i18n-title="removeHighlight">&times;</button>
  </div>

  <footer class="reader-footer" id="reader-footer">
    <span class="chapter-label" id="current-chapter"></span>
    <input type="range" class="progress-slider" id="progress-slider" min="0" max="100" value="0">
    <span class="progress-label" id="progress-percent">0%</span>
  </footer>

  <script src="js/i18n.js?v=12"></script>
  <script src="js/storage.js?v=12"></script>
  <script src="js/utils.js?v=12"></script>
  <script src="js/library.js?v=12"></script>
  <script src="js/annotations.js?v=12"></script>
  <script src="js/jszip.min.js?v=12"></script>
  <script src="js/epub.min.js?v=12"></script>
  <script src="js/reader-app.js?v=12"></script>
</body>
</html>
